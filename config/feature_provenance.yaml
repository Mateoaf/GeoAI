version: "2.0.0"
project: "GeoAI Mineral Prospectivity Mapping (MPM) Spain"
crs_standards:
  native_geographic_crs: "EPSG:4326 (WGS84)"
  working_projected_crs: "EPSG:25830 (ETRS89 / UTM Huso 30N)"

features:
  # ============================================================================
  # 1. GEOLOGÍA Y CRONOESTRATIGRAFÍA (LITOLOGÍA Y DOMINIOS IGME)
  # ============================================================================
  - name: "Real_IGME_Lithology_General"
    category: "Lithology"
    description: "Tipo litológico general predominante en la unidad geológica cartografiada"
    geological_rationale: "Controla la reactividad química, permeabilidad y encajante de fluidos hidrotermales mineralizantes"
    source_dataset: "Mapa Geológico Continuo de España 1:1.000.000 (GEODE 1M)"
    source_provider: "Instituto Geológico y Minero de España (IGME - CSIC)"
    source_url_or_endpoint: "https://mapas.igme.es/gis/rest/services/Cartografia_Geologica/IGME_Geologico_1M/MapServer/4"
    observed_or_derived: "OBSERVED"
    spatial_resolution: "1:1.000.000 (Polígonos vectoriales continuos)"
    crs_native: "EPSG:4326"
    crs_working: "EPSG:25830"
    mathematical_definition: "Point-in-polygon spatial intersection con polígonos del MapServer Capa 4"
    temporal_coverage_or_vintage: "2024"
    missing_data_policy: "Registrar 'UNMAPPED_OR_NODATA' con flag QA explícito. Cero imputación sintética."
    proxy_leakage_risk_assessment: "NONE (Capa geológica regional independiente de labores mineras)"

  - name: "Real_IGME_Era"
    category: "Stratigraphy"
    description: "Eón/Era geológica de formación de la roca encajante (Paleozoico, Precámbrico, Mesozoico, Cenozoico)"
    geological_rationale: "Los grandes eventos orogénicos metalogenéticos en la península ibérica ocurrieron en el Ciclo Varisco (Paleozoico)"
    source_dataset: "Mapa Geológico 1:1.000.000 (IGME)"
    source_provider: "IGME - CSIC"
    source_url_or_endpoint: "https://mapas.igme.es/gis/rest/services/Cartografia_Geologica/IGME_Geologico_1M/MapServer/4"
    observed_or_derived: "OBSERVED"
    spatial_resolution: "1:1.000.000 (Polígonos vectoriales)"
    crs_native: "EPSG:4326"
    crs_working: "EPSG:25830"
    mathematical_definition: "Point-in-polygon spatial intersection"
    temporal_coverage_or_vintage: "2024"
    missing_data_policy: "Registrar 'UNMAPPED_OR_NODATA' con flag QA explícito."
    proxy_leakage_risk_assessment: "NONE"

  - name: "Real_IGME_Dominio"
    category: "Tectonics"
    description: "Dominio o zona tectonotermal geológica del Macizo Ibérico o Cordilleras Alpinas"
    geological_rationale: "Diferencia provincias metalogénicas (Zona Centroibérica, Zona Sudportuguesa/Faja Pirítica, Ossa-Morena, Béticas)"
    source_dataset: "Mapa Geológico 1:1.000.000 (IGME)"
    source_provider: "IGME - CSIC"
    source_url_or_endpoint: "https://mapas.igme.es/gis/rest/services/Cartografia_Geologica/IGME_Geologico_1M/MapServer/4"
    observed_or_derived: "OBSERVED"
    spatial_resolution: "1:1.000.000 (Polígonos vectoriales)"
    crs_native: "EPSG:4326"
    crs_working: "EPSG:25830"
    mathematical_definition: "Point-in-polygon spatial intersection"
    temporal_coverage_or_vintage: "2024"
    missing_data_policy: "Registrar 'UNMAPPED_OR_NODATA' con flag QA explícito."
    proxy_leakage_risk_assessment: "NONE"

  # ============================================================================
  # 2. GEOLOGÍA ESTRUCTURAL Y TECTÓNICA LINEAL (IGME 1M)
  # ============================================================================
  - name: "Real_IGME_Dist_Fault_m"
    category: "Structural"
    description: "Distancia euclidiana mínima en metros a la falla, cabalgamiento o fractura geológica lineal del IGME"
    geological_rationale: "Las fallas y cizallas corticales actúan como conductos y trampas para fluidos hidrotermales mineralizantes"
    source_dataset: "Capa de Fallas del Mapa Geológico 1:1.000.000 (IGME Capa 2)"
    source_provider: "IGME - CSIC"
    source_url_or_endpoint: "https://mapas.igme.es/gis/rest/services/Cartografia_Geologica/IGME_Geologico_1M/MapServer/2"
    observed_or_derived: "DERIVED_FROM_OBSERVED"
    spatial_resolution: "LineString vectorial (15.000 entidades)"
    crs_native: "EPSG:4326"
    crs_working: "EPSG:25830"
    mathematical_definition: "min(geom.distance(point)) calculado mediante Shapely 2.0 STRtree sobre geometrías lineales proyectadas"
    temporal_coverage_or_vintage: "2024"
    missing_data_policy: "No nulos permitidos en dominio continental peninsular."
    proxy_leakage_risk_assessment: "NONE (Calculado exclusivamente sobre cartografía geológica oficial, sin proximidad a yacimientos)"

  - name: "Real_IGME_Dist_Contact_m"
    category: "Structural"
    description: "Distancia euclidiana mínima en metros al contacto litológico o intrusivo cartografiado más cercano"
    geological_rationale: "Contactos entre rocas ígneas y encajantes concentran skarns, hornfels y mineralizaciones hidrotermales"
    source_dataset: "Capa de Contactos Geológicos IGME 1M (Capa 2)"
    source_provider: "IGME - CSIC"
    source_url_or_endpoint: "https://mapas.igme.es/gis/rest/services/Cartografia_Geologica/IGME_Geologico_1M/MapServer/2"
    observed_or_derived: "DERIVED_FROM_OBSERVED"
    spatial_resolution: "LineString vectorial"
    crs_native: "EPSG:4326"
    crs_working: "EPSG:25830"
    mathematical_definition: "min(geom.distance(point)) mediante STRtree sobre geometrías de contacto"
    temporal_coverage_or_vintage: "2024"
    missing_data_policy: "No nulos en tierra."
    proxy_leakage_risk_assessment: "NONE"

  - name: "Real_IGME_Fault_Length_Density_5km"
    category: "Structural"
    description: "Densidad de longitud lineal de fallas por unidad de superficie en un radio de 5.000 m (km de falla / km²)"
    geological_rationale: "La densidad de fracturación cuantifica el daño tectónico y la permeabilidad secundaria acumulada"
    source_dataset: "Capa de Fallas IGME 1M (Capa 2)"
    source_provider: "IGME - CSIC"
    source_url_or_endpoint: "https://mapas.igme.es/gis/rest/services/Cartografia_Geologica/IGME_Geologico_1M/MapServer/2"
    observed_or_derived: "DERIVED_FROM_OBSERVED"
    spatial_resolution: "Ventana circular r=5.000 m"
    crs_native: "EPSG:4326"
    crs_working: "EPSG:25830"
    mathematical_definition: "sum(line.intersection(buffer_5km).length) / (pi * 5^2) en km/km²"
    temporal_coverage_or_vintage: "2024"
    missing_data_policy: "0.0 km/km² si no existen fallas en el buffer."
    proxy_leakage_risk_assessment: "NONE"

  # ============================================================================
  # 3. TOPOGRAFÍA Y GEOMORFOLOGÍA (DEM)
  # ============================================================================
  - name: "Real_Elevation_MDT_m"
    category: "Topography"
    description: "Elevación topográfica real en metros sobre el nivel del mar"
    geological_rationale: "Distingue macizos orogénicos paleozoicos exhumados de cuencas cenozoicas de relleno"
    source_dataset: "Copernicus Digital Elevation Model GLO-30m / IGN MDT05"
    source_provider: "European Space Agency (ESA) / IGN España"
    source_url_or_endpoint: "https://api.open-meteo.com/v1/elevation"
    observed_or_derived: "OBSERVED"
    spatial_resolution: "30 metros (GLO-30m)"
    crs_native: "EPSG:4326"
    crs_working: "EPSG:25830"
    mathematical_definition: "Muestreo puntual bilineal de elevación sobre el modelo digital del terreno"
    temporal_coverage_or_vintage: "2023"
    missing_data_policy: "np.nan con estado QA 'NODATA_ERROR' si falla el servicio. Excluido del vector predictor si no está 100% observado."
    proxy_leakage_risk_assessment: "NONE"

  - name: "Real_Slope_Deg"
    category: "Topography"
    description: "Pendiente topográfica del terreno en grados sexagesimales"
    geological_rationale: "Refleja competencia geomecánica y resistencia diferencial a la erosión"
    source_dataset: "Copernicus DEM GLO-30m"
    source_provider: "ESA / Open-Meteo"
    source_url_or_endpoint: "https://api.open-meteo.com/v1/elevation"
    observed_or_derived: "DERIVED_FROM_OBSERVED"
    spatial_resolution: "30 metros"
    crs_native: "EPSG:4326"
    crs_working: "EPSG:25830"
    mathematical_definition: "arctan(sqrt((dz/dx)^2 + (dz/dy)^2)) * 180 / pi"
    temporal_coverage_or_vintage: "2023"
    missing_data_policy: "np.nan si falla la cruz de 5 puntos del DEM."
    proxy_leakage_risk_assessment: "NONE"

  - name: "Real_TPI_1km"
    category: "Topography"
    description: "Topographic Position Index (TPI) en radio de 1 km (diferencia entre elevación puntual y media circundante)"
    geological_rationale: "Discrimina crestas estructurales (+TPI) de fondos de valle y canales aluviales (-TPI)"
    source_dataset: "Copernicus DEM GLO-30m"
    source_provider: "ESA / Open-Meteo"
    source_url_or_endpoint: "https://api.open-meteo.com/v1/elevation"
    observed_or_derived: "DERIVED_FROM_OBSERVED"
    spatial_resolution: "Ventana móvil 1 km"
    crs_native: "EPSG:4326"
    crs_working: "EPSG:25830"
    mathematical_definition: "z_centro - mean(z_norte, z_sur, z_este, z_oeste)"
    temporal_coverage_or_vintage: "2023"
    missing_data_policy: "np.nan en caso de ausencia de DEM."
    proxy_leakage_risk_assessment: "NONE"

  - name: "Real_TRI_Roughness"
    category: "Topography"
    description: "Terrain Ruggedness Index (TRI) - Desviación estándar de elevaciones locales"
    geological_rationale: "Cuantifica la rugosidad y heterogeneidad geomorfológica"
    source_dataset: "Copernicus DEM GLO-30m"
    source_provider: "ESA / Open-Meteo"
    source_url_or_endpoint: "https://api.open-meteo.com/v1/elevation"
    observed_or_derived: "DERIVED_FROM_OBSERVED"
    spatial_resolution: "30 metros"
    crs_native: "EPSG:4326"
    crs_working: "EPSG:25830"
    mathematical_definition: "std([z_centro, z_norte, z_sur, z_este, z_oeste])"
    temporal_coverage_or_vintage: "2023"
    missing_data_policy: "np.nan en caso de error en DEM."
    proxy_leakage_risk_assessment: "NONE"

  # ============================================================================
  # 4. VARIABLES ESPACIALES INDEXADAS (SUJETAS A ABLATION TEST)
  # ============================================================================
  - name: "Coord_X"
    category: "Spatial_Index"
    description: "Coordenada X métrica proyectada en EPSG:25830 (UTM Huso 30N)"
    geological_rationale: "Utilizada para GIS, spatial block clustering y ablation test. EXCLUIDA DEL MODELO OFICIAL."
    source_dataset: "Proyección geométrica oficial"
    source_provider: "IGN España / EPSG"
    source_url_or_endpoint: "https://epsg.io/25830"
    observed_or_derived: "SPATIAL_INDEX_ONLY"
    spatial_resolution: "Métrica exacta"
    crs_native: "EPSG:4326"
    crs_working: "EPSG:25830"
    mathematical_definition: "pyproj.Transformer.from_crs('EPSG:4326', 'EPSG:25830')"
    temporal_coverage_or_vintage: "Invariable"
    missing_data_policy: "Prohibido NaN"
    proxy_leakage_risk_assessment: "HIGH_SPATIAL_MEMORIZATION (Excluida formalmente del entrenamiento oficial)"

  - name: "Coord_Y"
    category: "Spatial_Index"
    description: "Coordenada Y métrica proyectada en EPSG:25830 (UTM Huso 30N)"
    geological_rationale: "Utilizada para GIS, spatial block clustering y ablation test. EXCLUIDA DEL MODELO OFICIAL."
    source_dataset: "Proyección geométrica oficial"
    source_provider: "IGN España / EPSG"
    source_url_or_endpoint: "https://epsg.io/25830"
    observed_or_derived: "SPATIAL_INDEX_ONLY"
    spatial_resolution: "Métrica exacta"
    crs_native: "EPSG:4326"
    crs_working: "EPSG:25830"
    mathematical_definition: "pyproj.Transformer.from_crs('EPSG:4326', 'EPSG:25830')"
    temporal_coverage_or_vintage: "Invariable"
    missing_data_policy: "Prohibido NaN"
    proxy_leakage_risk_assessment: "HIGH_SPATIAL_MEMORIZATION (Excluida formalmente del entrenamiento oficial)"
