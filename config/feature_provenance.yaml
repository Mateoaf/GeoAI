version: "2.0.0"
project: "GeoAI Mineral Prospectivity Mapping (MPM) Spain"
crs_standards:
  native_geographic_crs: "EPSG:4326 (WGS84)"
  working_projected_crs: "EPSG:25830 (ETRS89 / UTM Huso 30N)"

features:
  # ============================================================================
  # 1. GEOLOGÍA Y CRONOESTRATIGRAFÍA (LITOLOGÍA Y DOMINIOS)
  # ============================================================================
  - name: "Real_IGME_Lithology_General"
    family: "Lithology"
    description: "Tipo litológico general predominante en la unidad geológica cartografiada"
    geological_rationale: "Controla la reactividad química, permeabilidad y encajante de fluidos hidrotermales mineralizantes"
    source: "Mapa Geológico Continuo de España 1:1.000.000 (IGME/CSIC)"
    source_url: "https://mapas.igme.es/gis/rest/services/Cartografia_Geologica/IGME_Geologico_1M/MapServer/4"
    provider: "Instituto Geológico y Minero de España (IGME - CSIC)"
    dataset_version: "GEODE 1M v2024"
    observed_or_derived: "OBSERVED"
    native_resolution: "1:1.000.000 (escala vectorial)"
    working_resolution: "Polígonos vectoriales continuos"
    native_crs: "EPSG:4326"
    output_crs: "EPSG:25830"
    extraction_method: "Point-in-polygon spatial intersection"
    transformation: "OneHotEncoder(handle_unknown='ignore')"
    nodata_policy: "Impute 'Sedimentos de cuenca terciaria / No diferenciado'"
    temporal_reference: "2024"
    leakage_risk: "NONE"

  - name: "Real_IGME_Era"
    family: "Stratigraphy"
    description: "Eón/Era geológica de formación de la roca encajante (Paleozoico, Precámbrico, Mesozoico, Cenozoico)"
    geological_rationale: "Los grandes eventos orogénicos metalogenéticos en la península ocurrieron en el Ciclo Varisco/Hercínico (Paleozoico)"
    source: "Mapa Geológico 1:1.000.000 (IGME)"
    source_url: "https://mapas.igme.es/gis/rest/services/Cartografia_Geologica/IGME_Geologico_1M/MapServer/4"
    provider: "IGME - CSIC"
    dataset_version: "GEODE 1M v2024"
    observed_or_derived: "OBSERVED"
    native_resolution: "1:1.000.000"
    working_resolution: "Vectorial"
    native_crs: "EPSG:4326"
    output_crs: "EPSG:25830"
    extraction_method: "Point-in-polygon spatial intersection"
    transformation: "OneHotEncoder(handle_unknown='ignore')"
    nodata_policy: "Impute 'CENOZOICO'"
    temporal_reference: "2024"
    leakage_risk: "NONE"

  - name: "Real_IGME_Dominio"
    family: "Tectonics"
    description: "Dominio o zona tectonotermal geológica del Macizo Ibérico o Cordilleras Alpinas"
    geological_rationale: "Diferencia provincias metalogénicas (Zona Centroibérica, Zona Sudportuguesa/Faja Pirítica, Béticas, etc.)"
    source: "Mapa Geológico 1:1.000.000 (IGME)"
    source_url: "https://mapas.igme.es/gis/rest/services/Cartografia_Geologica/IGME_Geologico_1M/MapServer/4"
    provider: "IGME - CSIC"
    dataset_version: "GEODE 1M v2024"
    observed_or_derived: "OBSERVED"
    native_resolution: "1:1.000.000"
    working_resolution: "Vectorial"
    native_crs: "EPSG:4326"
    output_crs: "EPSG:25830"
    extraction_method: "Point-in-polygon spatial intersection"
    transformation: "OneHotEncoder(handle_unknown='ignore')"
    nodata_policy: "Impute 'CUENCAS SEDIMENTARIAS'"
    temporal_reference: "2024"
    leakage_risk: "NONE"

  # ============================================================================
  # 2. GEOLOGÍA ESTRUCTURAL Y TECTÓNICA
  # ============================================================================
  - name: "Real_IGME_Dist_Fault_m"
    family: "Structural"
    description: "Distancia euclidiana en metros a la falla, cabalgamiento o fractura geológica real más cercana del IGME"
    geological_rationale: "Las fallas y cizallas actúan como trampas y canales hidrotermales de primer orden para fluidos mineralizantes"
    source: "Capa de Contactos y Fallas del Mapa Geológico 1:1.000.000 (IGME Capa 2)"
    source_url: "https://mapas.igme.es/gis/rest/services/Cartografia_Geologica/IGME_Geologico_1M/MapServer/2"
    provider: "IGME - CSIC"
    dataset_version: "Capa 2 (Fallas y Contactos) 2024"
    observed_or_derived: "DERIVED_FROM_OBSERVED"
    native_resolution: "LineString vectorial 1:1.000.000"
    working_resolution: "Líneas vectoriales en EPSG:25830"
    native_crs: "EPSG:4326"
    output_crs: "EPSG:25830"
    extraction_method: "cKDTree nearest Euclidean distance to verified line segments"
    transformation: "StandardScaler"
    nodata_policy: "Default to 50000.0 m (máxima distancia regional)"
    temporal_reference: "2024"
    leakage_risk: "NONE (Verificado: no utiliza coordenadas de yacimientos)"

  - name: "Real_IGME_Dist_Contact_m"
    family: "Structural"
    description: "Distancia euclidiana en metros al contacto litológico o intrusivo más cercano"
    geological_rationale: "Contactos entre rocas ígneas y sedimentarias concentran skarns, hornfels y mineralizaciones tipo greisen"
    source: "Capa de Contactos Geológicos IGME 1M"
    source_url: "https://mapas.igme.es/gis/rest/services/Cartografia_Geologica/IGME_Geologico_1M/MapServer/2"
    provider: "IGME - CSIC"
    dataset_version: "2024"
    observed_or_derived: "DERIVED_FROM_OBSERVED"
    native_resolution: "LineString vectorial"
    working_resolution: "EPSG:25830"
    native_crs: "EPSG:4326"
    output_crs: "EPSG:25830"
    extraction_method: "cKDTree nearest Euclidean distance to contact lines"
    transformation: "StandardScaler"
    nodata_policy: "Default to 50000.0 m"
    temporal_reference: "2024"
    leakage_risk: "NONE"

  - name: "Real_IGME_Fault_Density_5km"
    family: "Structural"
    description: "Número de trazas de fallas y vértices estructurales dentro de un radio de 5.000 metros"
    geological_rationale: "La alta densidad de fracturación indica permeabilidad secundaria cortical y reactivación tectónica repetida"
    source: "Capa de Fallas IGME 1M"
    source_url: "https://mapas.igme.es/gis/rest/services/Cartografia_Geologica/IGME_Geologico_1M/MapServer/2"
    provider: "IGME - CSIC"
    dataset_version: "2024"
    observed_or_derived: "DERIVED_FROM_OBSERVED"
    native_resolution: "LineString vectorial"
    working_resolution: "Conteo por radio euclidiano 5 km"
    native_crs: "EPSG:4326"
    output_crs: "EPSG:25830"
    extraction_method: "KDTree count_neighbors in r=5000m"
    transformation: "StandardScaler"
    nodata_policy: "0"
    temporal_reference: "2024"
    leakage_risk: "NONE"

  # ============================================================================
  # 3. TOPOGRAFÍA Y GEOMORFOLOGÍA (DEM)
  # ============================================================================
  - name: "Real_Elevation_MDT_m"
    family: "Topography"
    description: "Elevación topográfica real en metros sobre el nivel del mar"
    geological_rationale: "Distingue relieves orogénicos exhumados de llanuras de cuenca sedimentaria reciente"
    source: "Copernicus Digital Elevation Model GLO-30m / IGN MDT05"
    source_url: "https://registry.opendata.aws/copernicus-dem/"
    provider: "European Space Agency (ESA) / IGN España"
    dataset_version: "GLO-30m v2023"
    observed_or_derived: "OBSERVED"
    native_resolution: "30 metros"
    working_resolution: "Puntual por interpolación bilineal DEM"
    native_crs: "EPSG:4326"
    output_crs: "EPSG:25830"
    extraction_method: "Bilinear sampling from DEM raster / API"
    transformation: "StandardScaler"
    nodata_policy: "Median regional elevation (550 m)"
    temporal_reference: "2023"
    leakage_risk: "NONE"

  - name: "Real_Slope_Deg"
    family: "Topography"
    description: "Pendiente topográfica del terreno en grados sexagesimales"
    geological_rationale: "Refleja resistencia diferencial a la erosión (cuarcitas/granitos resistentes frente a arcillas blandas)"
    source: "Derivado del Copernicus DEM 30m"
    source_url: "https://registry.opendata.aws/copernicus-dem/"
    provider: "ESA / IGN"
    dataset_version: "GLO-30m v2023"
    observed_or_derived: "DERIVED_FROM_OBSERVED"
    native_resolution: "30 metros"
    working_resolution: "30 metros"
    native_crs: "EPSG:4326"
    output_crs: "EPSG:25830"
    extraction_method: "Horn algorithm gradient on DEM grid"
    transformation: "StandardScaler"
    nodata_policy: "0.0 grados"
    temporal_reference: "2023"
    leakage_risk: "NONE"

  - name: "Real_TPI_1km"
    family: "Topography"
    description: "Topographic Position Index (TPI) en radio de 1 km (diferencia entre elevación puntual y media circundante)"
    geological_rationale: "Identifica crestas estructurales (+TPI) y valles/canales fluviales (-TPI)"
    source: "Derivado del Copernicus DEM 30m"
    source_url: "https://registry.opendata.aws/copernicus-dem/"
    provider: "ESA / IGN"
    dataset_version: "GLO-30m v2023"
    observed_or_derived: "DERIVED_FROM_OBSERVED"
    native_resolution: "30 metros"
    working_resolution: "1 km moving window"
    native_crs: "EPSG:4326"
    output_crs: "EPSG:25830"
    extraction_method: "TPI neighborhood analysis on DEM"
    transformation: "StandardScaler"
    nodata_policy: "0.0"
    temporal_reference: "2023"
    leakage_risk: "NONE"

  - name: "Real_TRI_Roughness"
    family: "Topography"
    description: "Terrain Ruggedness Index (TRI) - Índice de rugosidad topográfica"
    geological_rationale: "Cuantifica la heterogeneidad y fracturación del relieve a escala local"
    source: "Derivado del Copernicus DEM 30m"
    source_url: "https://registry.opendata.aws/copernicus-dem/"
    provider: "ESA / IGN"
    dataset_version: "GLO-30m v2023"
    observed_or_derived: "DERIVED_FROM_OBSERVED"
    native_resolution: "30 metros"
    working_resolution: "30 metros"
    native_crs: "EPSG:4326"
    output_crs: "EPSG:25830"
    extraction_method: "Riley et al. TRI calculation"
    transformation: "StandardScaler"
    nodata_policy: "0.0"
    temporal_reference: "2023"
    leakage_risk: "NONE"

  # ============================================================================
  # 4. VARIABLES ESPACIALES INDEXADAS (SUJETAS A ABLATION TEST)
  # ============================================================================
  - name: "Coord_X"
    family: "Spatial_Coordinate"
    description: "Coordenada X métrica en proyección oficial EPSG:25830 (UTM Huso 30N)"
    geological_rationale: "Permite evaluar efectos de gradiente este-oeste. Evaluada mediante ablation test para evitar memorización geográfica."
    source: "Proyección geométrica oficial de coordenadas"
    source_url: "https://epsg.io/25830"
    provider: "IGN España / EPSG Registry"
    dataset_version: "ETRS89 / UTM 30N"
    observed_or_derived: "DERIVED_FROM_OBSERVED"
    native_resolution: "Métrica exacta"
    working_resolution: "Metros"
    native_crs: "EPSG:4326"
    output_crs: "EPSG:25830"
    extraction_method: "PyProj / GeoPandas transformation"
    transformation: "StandardScaler"
    nodata_policy: "Prohibido NaN"
    temporal_reference: "Invariable"
    leakage_risk: "HIGH_SPATIAL_MEMORIZATION (Sujeta a Ablation Test OBLIGATORIO)"

  - name: "Coord_Y"
    family: "Spatial_Coordinate"
    description: "Coordenada Y métrica en proyección oficial EPSG:25830 (UTM Huso 30N)"
    geological_rationale: "Permite evaluar gradiente norte-sur. Evaluada mediante ablation test."
    source: "Proyección geométrica oficial de coordenadas"
    source_url: "https://epsg.io/25830"
    provider: "IGN España / EPSG Registry"
    dataset_version: "ETRS89 / UTM 30N"
    observed_or_derived: "DERIVED_FROM_OBSERVED"
    native_resolution: "Métrica exacta"
    working_resolution: "Metros"
    native_crs: "EPSG:4326"
    output_crs: "EPSG:25830"
    extraction_method: "PyProj / GeoPandas transformation"
    transformation: "StandardScaler"
    nodata_policy: "Prohibido NaN"
    temporal_reference: "Invariable"
    leakage_risk: "HIGH_SPATIAL_MEMORIZATION (Sujeta a Ablation Test OBLIGATORIO)"

  # ============================================================================
  # 5. CAPAS PENDIENTES DE DISPONIBILIDAD DE RASTER NACIONAL CONTINUO (NO SINTETIZADAS)
  # ============================================================================
  - name: "Pending_Bouguer_Anomaly_Raster"
    family: "Geophysics"
    description: "Malla gravimétrica nacional de Bouguer del IGN/IGME"
    geological_rationale: "Refleja anomalías de densidad cortical y cuerpos magmáticos profundos"
    source: "Instituto Geográfico Nacional (IGN) / IGME"
    source_url: "https://www.ign.es"
    provider: "IGN / IGME"
    dataset_version: "Malla Gravimétrica Nacional (Pendiente)"
    observed_or_derived: "PENDING_OBSERVATION"
    native_resolution: "Malla 1 km (Pendiente de raster)"
    working_resolution: "Pendiente"
    native_crs: "EPSG:4258"
    output_crs: "EPSG:25830"
    extraction_method: "Bilinear raster sampling (cuando esté integrado)"
    transformation: "StandardScaler"
    nodata_policy: "Excluido del modelo v2"
    temporal_reference: "Pendiente"
    leakage_risk: "NONE"
    status: "PENDING_HIGH_RES_RASTER"
    policy: "NO SINTETIZAR. Se incorporará cuando el raster oficial esté descargado."

  - name: "Pending_Geochemistry_Sediments_Raster"
    family: "Geochemistry"
    description: "Muestras continuas de sedimentos fluviales del Atlas Geoquímico de España (FOREGS/GEMAS)"
    geological_rationale: "Halos de dispersión secundaria de metales pesados y pathfinders hidrotermales"
    source: "Atlas Geoquímico de España (IGME/CSIC)"
    source_url: "https://mapas.igme.es"
    provider: "IGME / CSIC"
    dataset_version: "Atlas Geoquímico (Pendiente)"
    observed_or_derived: "PENDING_OBSERVATION"
    native_resolution: "Muestreo puntual geoquímico"
    working_resolution: "Pendiente"
    native_crs: "EPSG:4258"
    output_crs: "EPSG:25830"
    extraction_method: "Kriging geoestadístico continuo"
    transformation: "StandardScaler"
    nodata_policy: "Excluido del modelo v2"
    temporal_reference: "Pendiente"
    leakage_risk: "NONE"
    status: "PENDING_CONTINUOUS_SURVEY"
    policy: "NO SINTETIZAR con condicionales de commodity. Se incorporará mediante kriging de muestras observadas."
