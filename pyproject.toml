[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geoai-roman-spain"
version = "2.0.0"
description = "Audited Mineral Prospectivity Mapping (MPM) and Geoscientific AI Pipeline for Spain"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "geopandas>=0.14.0",
  "shapely>=2.0.0",
  "pyproj>=3.6.0",
  "scipy>=1.10.0",
  "scikit-learn>=1.3.0",
  "lightgbm>=4.0.0",
  "joblib>=1.3.0",
  "pyyaml>=6.0",
  "requests>=2.31.0",
  "matplotlib>=3.7.0",
  "openpyxl>=3.1.0",
  "pytest>=7.4.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
