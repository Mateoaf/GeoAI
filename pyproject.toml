[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geoai-roman-spain"
version = "0.2.0"
description = "Reproducible OxREP audit and Spanish Roman-mining dataset preparation"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<4",
  "Pillow>=10,<13",
  "reportlab>=4.4,<5"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
